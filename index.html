<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lectern turns a recorded lecture into a transcript with timestamps. It runs on your Mac. No account, nothing uploaded." />
    <title>Lectern, download</title>
    <!-- Applies the saved light or dark choice before the first paint, and follows it across tabs -->
    <script>
      try {
        var saved = localStorage.getItem('lx-theme')
        if (saved) document.documentElement.setAttribute('data-theme', saved)
        addEventListener('storage', function (event) {
          if (event.key === 'lx-theme' && event.newValue) document.documentElement.setAttribute('data-theme', event.newValue)
        })
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
